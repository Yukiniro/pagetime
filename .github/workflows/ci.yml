name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Active LTS. README and Vite require Node.js >= 22.12.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # npm test asserts the Sites preview files under dist/.
      - name: Build preview
        run: npm run build:preview

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Verify extension artifacts
        run: npm run verify-build

      - name: Check changesets
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: npm run changeset:status -- --since="origin/$BASE_BRANCH"

  e2e:
    name: browser e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and xvfb
        run: npx playwright install --with-deps chromium && sudo apt-get install -y xvfb openbox xdotool x11-utils

      - name: Build extension
        run: npm run build

      - name: End-to-end tests
        run: xvfb-run -a npm run test:e2e
